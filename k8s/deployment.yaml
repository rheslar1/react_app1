apiVersion: apps/v1
kind: Deployment

metadata:
  name: react-app
  namespace: react-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: react-app

  template:
    metadata:
      labels:
        app: react-app

    spec:
      containers:
      - name: react-app

        image: ghcr.io/rheslar1/react-app:latest

        imagePullPolicy: Always

        ports:
          - containerPort: 80

        resources:
          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 500m
            memory: 512Mi