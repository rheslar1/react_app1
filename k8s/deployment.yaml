apiVersion: apps/v1
kind: Deployment

metadata:
  name: react-app
  namespace: react-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: react-app

  template:
    metadata:
      labels:
        app: react-app

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      imagePullSecrets:
      - name: dockerhub-pull

      containers:
      - name: react-app

        image: docker.io/rheslar15/react-app:latest

        imagePullPolicy: Always

        ports:
          - containerPort: 8080

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        volumeMounts:
        - name: tmp
          mountPath: /tmp

        resources:
          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 500m
            memory: 512Mi

      volumes:
      - name: tmp
        emptyDir: {}
