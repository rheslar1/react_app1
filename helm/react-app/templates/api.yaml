apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "react-app.name" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: relay-api
    {{- include "react-app.componentLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: relay-api
  template:
    metadata:
      labels:
        app: relay-api
        {{- include "react-app.componentLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "react-app.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: MYSQL_HOST
              value: {{ printf "%s:%v" .Values.api.database.host .Values.mysql.service.port | quote }}
            - name: MYSQL_DATABASE
              value: {{ .Values.api.database.name | quote }}
            - name: MYSQL_USER
              value: {{ .Values.api.database.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.database.secretName | quote }}
                  key: {{ .Values.api.database.passwordKey | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.api.cookieSecure | quote }}
            - name: APP_ENVIRONMENT
              value: {{ .Values.api.environment | quote }}
            - name: APP_VERSION
              value: {{ .Values.api.version | quote }}
            - name: APP_REVISION
              value: {{ .Values.api.revision | quote }}
            - name: APP_IMAGE_DIGEST
              value: {{ .Values.api.imageDigest | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.api.service.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "react-app.componentLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: relay-api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
