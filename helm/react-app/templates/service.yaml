apiVersion: v1
kind: Service
metadata:
  name: {{ include "react-app.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "react-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "react-app.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
