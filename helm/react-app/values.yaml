replicaCount: 3

image:
  repository: docker.io/rheslar15/react-app
  # CI pins the exact image by digest (sha256:...); tag is the fallback.
  digest: "sha256:aa0c154b8262320f99e04a116e7816ef609b71067b0efeaaf272ea172927df93"
  tag: 5f7b1af0c1d1354ab03d0b9a22b193065af01775
  pullPolicy: IfNotPresent

# The Docker Hub repo is public, so no pull secret is needed. If you make it
# private, create the secret once in the namespace and list it here, e.g.
#   imagePullSecrets:
#     - name: dockerhub-pull
imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: react.local

autoscaling:
  # Needs metrics-server in the cluster (not included in Docker Desktop)
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

networkPolicy:
  enabled: true
