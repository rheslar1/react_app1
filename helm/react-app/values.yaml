replicaCount: 3

image:
  repository: docker.io/rheslar15/react-app
  # CI pins the exact image by digest (sha256:...); tag is the fallback.
  digest: "sha256:2bb803e792616e4d49207c62fe298e11e001a663b4c2c0d99f860a8601f01445"
  tag: f858b3a4832855cc0332bdfeac20c88d1a9db2c9
  pullPolicy: IfNotPresent

# The Docker Hub repo is public, so no pull secret is needed. If you make it
# private, create the secret once in the namespace and list it here, e.g.
#   imagePullSecrets:
#     - name: dockerhub-pull
imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  # Needs an ingress controller (e.g. ingress-nginx); not in Docker Desktop
  enabled: false
  className: nginx
  host: react.local

autoscaling:
  # Needs metrics-server in the cluster (not included in Docker Desktop)
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

networkPolicy:
  enabled: true
