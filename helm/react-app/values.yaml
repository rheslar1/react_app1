replicaCount: 3

image:
  repository: docker.io/rheslar15/react-app
  # CI pins the exact image by digest (sha256:...); tag is the fallback.
  digest: "sha256:88c2fb417a0b1118412693e36cfff11c9f04b976623bc43e2d6c78fd5d5e24cb"
  tag: 956cbb059c1d1bd2c156b4d4369dac13aaf88555
  pullPolicy: IfNotPresent

# The Docker Hub repo is public, so no pull secret is needed. If you make it
# private, create the secret once in the namespace and list it here, e.g.
#   imagePullSecrets:
#     - name: dockerhub-pull
imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  # Needs an ingress controller (e.g. ingress-nginx); not in Docker Desktop
  enabled: false
  className: nginx
  host: react.local

autoscaling:
  # Needs metrics-server in the cluster (not included in Docker Desktop)
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

networkPolicy:
  enabled: true
