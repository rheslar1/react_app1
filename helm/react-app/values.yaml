replicaCount: 3

image:
  repository: docker.io/rheslar15/react-app
  # CI pins the exact image by digest (sha256:...); tag is the fallback.
  digest: "sha256:3fb7fe727130571d72e5153a54a4e99d2d9c22502af139cfcfe2cda6e1b0d23d"
  tag: 83597d93e79cd4907a8aa9bf5a581e40c074bee9
  pullPolicy: IfNotPresent

# The Docker Hub repo is public, so no pull secret is needed. If you make it
# private, create the secret once in the namespace and list it here, e.g.
#   imagePullSecrets:
#     - name: dockerhub-pull
imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  # Optional local-cluster browser access. Leave unset for ClusterIP.
  nodePort: null

api:
  replicaCount: 1
  image:
    repository: docker.io/rheslar15/relay-api
    digest: "sha256:7eb946b2d10b8747f67da2eaec25de4559df0d622383ad31a9ad51381b0c98a8"
    tag: 83597d93e79cd4907a8aa9bf5a581e40c074bee9
    pullPolicy: IfNotPresent
  service:
    name: relay-api
    port: 8081
  cookieSecure: true
  environment: production
  version: ""
  revision: ""
  imageDigest: "sha256:7eb946b2d10b8747f67da2eaec25de4559df0d622383ad31a9ad51381b0c98a8"
  database:
    host: mysql
    name: relayops
    user: relay
    secretName: relayops-db
    passwordKey: password
  resources:
    requests:
      cpu: 100m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  service:
    name: mysql
    port: 3306
  database: relayops
  user: relay
  secretName: relayops-db
  rootPasswordKey: root-password
  passwordKey: password
  persistence:
    enabled: true
    storageClassName: ""
    size: 8Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

ingress:
  # Needs an ingress controller (e.g. ingress-nginx); not in Docker Desktop
  enabled: false
  className: nginx
  host: react.local

autoscaling:
  # Needs metrics-server in the cluster (not included in Docker Desktop)
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

networkPolicy:
  enabled: true
