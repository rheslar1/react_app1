replicaCount: 3

image:
  repository: docker.io/rheslar15/react-app
  # CI pins the exact image by digest (sha256:...); tag is the fallback.
  digest: "sha256:aa0c154b8262320f99e04a116e7816ef609b71067b0efeaaf272ea172927df93"
  tag: 5f7b1af0c1d1354ab03d0b9a22b193065af01775
  pullPolicy: IfNotPresent

# Private Docker Hub repo: create this secret once in the namespace
# (see README / argocd/application.yaml).
imagePullSecrets:
  - name: dockerhub-pull

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: react.local

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

networkPolicy:
  enabled: true
