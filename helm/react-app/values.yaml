replicaCount: 3

image:
  repository: docker.io/rheslar15/react-app
  # CI pins the exact image by digest (sha256:...); tag is the fallback.
  digest: "sha256:dc8df410115b44f57834e6083d5601343a45e600de97a7bb6865a525ffda1914"
  tag: 61c1d3a2400923907fea59fdc4688fa6e995a283
  pullPolicy: IfNotPresent

# The Docker Hub repo is public, so no pull secret is needed. If you make it
# private, create the secret once in the namespace and list it here, e.g.
#   imagePullSecrets:
#     - name: dockerhub-pull
imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  # Optional local-cluster browser access. Leave unset for ClusterIP.
  nodePort: null

api:
  replicaCount: 1
  image:
    repository: docker.io/rheslar15/relay-api
    digest: "sha256:86bc2a195ea979726a6ab980de0339958f62918ae2a0d38c3f840ba6ea2864fa"
    tag: 61c1d3a2400923907fea59fdc4688fa6e995a283
    pullPolicy: IfNotPresent
  service:
    name: relay-api
    port: 8081
  cookieSecure: true
  environment: production
  version: ""
  revision: ""
  imageDigest: "sha256:86bc2a195ea979726a6ab980de0339958f62918ae2a0d38c3f840ba6ea2864fa"
  database:
    host: mysql
    name: relayops
    user: relay
    secretName: relayops-db
    passwordKey: password
  resources:
    requests:
      cpu: 100m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  service:
    name: mysql
    port: 3306
  database: relayops
  user: relay
  secretName: relayops-db
  rootPasswordKey: root-password
  passwordKey: password
  persistence:
    enabled: true
    storageClassName: ""
    size: 8Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

ingress:
  # Needs an ingress controller (e.g. ingress-nginx); not in Docker Desktop
  enabled: false
  className: nginx
  host: react.local

autoscaling:
  # Needs metrics-server in the cluster (not included in Docker Desktop)
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

networkPolicy:
  enabled: true
