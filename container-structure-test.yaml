schemaVersion: 2.0.0

fileExistenceTests:
  - name: nginx config is present
    path: /etc/nginx/conf.d/default.conf
    shouldExist: true

  - name: index.html is served from dist
    path: /usr/share/nginx/html/index.html
    shouldExist: true

metadataTests:
  - exposedPorts: ['8080']
  - user: '101'
  - cmd: ['nginx', '-g', 'daemon off;']
