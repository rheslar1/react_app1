name: React CI

'on':
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - name: Install Dependencies
      run: npm ci

    - name: Run Build
      run: npm run build

    - name: Test Go API
      working-directory: backend
      run: go test ./... && go vet ./...