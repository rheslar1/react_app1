# cspell:words buildx
name: Deploy

'on':
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: docker.io

permissions:
  contents: read

jobs:
  # 1. Static scan: lint + dependency audit
  scan:
    name: Static scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Dependency audit
      run: npm audit --audit-level=high

  # 2. Build: compile the app and keep the output for later stages
  build:
    name: Build
    needs: scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Run Build
      run: npm run build

    - name: Package build output with SHA-256 checksum
      run: |
        tar -czf dist.tar.gz dist
        sha256sum dist.tar.gz k8s/*.yaml > SHA256SUMS
        cat SHA256SUMS

    - name: Upload build output
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: |
          dist.tar.gz
          SHA256SUMS
        if-no-files-found: error

  # 3. Test: unit tests (if defined) and a container smoke test
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Download build output
      uses: actions/download-artifact@v4
      with:
        name: dist

    - name: Verify artifact SHA-256
      run: sha256sum --check --strict SHA256SUMS

    - name: Unit tests
      run: npm test --if-present

    - name: Build image for smoke test
      run: docker build -t react-app:test .

    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@v0.33.1
      with:
        image-ref: react-app:test
        version: v0.75.0
        severity: CRITICAL
        exit-code: '1'
        ignore-unfixed: true

    - name: Smoke test container
      run: |
        docker run -d --name smoke -p 8080:80 react-app:test
        for i in $(seq 1 15); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
          [ "$code" = "200" ] && echo "Smoke test passed" && exit 0
          sleep 2
        done
        echo "::error::Container did not return HTTP 200 (last status: $code)"
        docker logs smoke
        exit 1

  # 4. Verify secrets: fail early with a clear message if any are missing
  verify-secrets:
    name: Verify secrets
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Check required secrets
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      run: |
        missing=0
        for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN KUBE_CONFIG; do
          if [ -z "${!name}" ]; then
            echo "::error::Secret $name is not set (Settings > Secrets and variables > Actions)"
            missing=1
          fi
        done
        exit $missing

  # 5. Deploy: push the image and roll it out to the cluster
  deploy:
    name: Deploy
    needs: verify-secrets
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Download build output
      uses: actions/download-artifact@v4
      with:
        name: dist

    - name: Verify artifact SHA-256 (build output and manifests)
      run: sha256sum --check --strict SHA256SUMS

    - name: Set image name
      run: echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/react-app" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4

    - name: Configure cluster access
      env:
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      run: |
        mkdir -p "$HOME/.kube"
        echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
        chmod 600 "$HOME/.kube/config"

    - name: Pin image in manifest
      run: |
        sed -i "s|image: .*react-app:.*|image: ${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}|" k8s/deployment.yaml
        grep -n "image:" k8s/deployment.yaml

    - name: Apply manifests
      run: |
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/

    - name: Create Docker Hub pull secret
      env:
        DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        kubectl -n react-app create secret docker-registry dockerhub-pull \
          --docker-server=https://index.docker.io/v1/ \
          --docker-username="$DH_USER" \
          --docker-password="$DH_TOKEN" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Wait for rollout
      id: rollout
      run: kubectl -n react-app rollout status deployment/react-app --timeout=180s

    - name: Roll back on failed rollout
      if: failure() && steps.rollout.outcome == 'failure'
      run: kubectl -n react-app rollout undo deployment/react-app
