# cspell:words buildx cppcheck misconfig tmpfs esac cyclonedx slsaprovenance coverpkg
name: Deploy

'on':
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'argocd/**'
      - '**.md'
  workflow_dispatch:
  # Run scan/build/test on pull requests (Dependabot included); never deploy
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: docker.io

permissions:
  contents: read

jobs:
  # 0. Dependency review: block PRs that introduce newly-vulnerable packages
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Dependency review
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
      with:
        fail-on-severity: high

  # 1. Static scan: lint (incl. security rules) + dependency audit
  scan:
    name: Static scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
        cache: npm

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - name: Install Dependencies
      run: npm ci

    - name: Lint (ESLint with security rules)
      run: npm run lint

    - name: Lint Go API
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.15.0
        working-directory: backend

    - name: Go vulnerability scan
      working-directory: backend
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
        govulncheck ./...

    - name: Dependency audit
      run: npm audit --audit-level=high

    - name: Lint Dockerfile (hadolint)
      run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile

    - name: Lint API Dockerfile (hadolint)
      run: docker run --rm -i hadolint/hadolint:v2.12.0 < backend/Dockerfile

    - name: Lint Helm chart (strict)
      run: docker run --rm -v "$PWD/helm:/charts" alpine/helm:3.17.0 lint --strict /charts/react-app

    - name: Render Helm chart
      run: docker run --rm -v "$PWD/helm:/charts" alpine/helm:3.17.0 template react-app /charts/react-app --namespace react-app > /dev/null

    - name: Render local NodePort variant
      run: |
        docker run --rm -v "$PWD/helm:/charts" alpine/helm:3.17.0 template react-app /charts/react-app --namespace react-app --set service.nodePort=30080 | grep -A5 -B2 'nodePort: 30080'

  # 1b. Static analysis: CodeQL, the JavaScript/TypeScript equivalent of cppcheck
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      with:
        languages: javascript-typescript

    - name: Analyze
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      with:
        # Dependabot PRs get a read-only token and cannot upload results
        upload: ${{ github.actor == 'dependabot[bot]' && 'never' || 'always' }}

  # 1c. Security scan: vulnerabilities, committed secrets and misconfigurations
  security-scan:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Trivy filesystem scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: v0.75.0
        scan-type: fs
        scanners: vuln,secret,misconfig
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        trivyignores: .trivyignore.yaml
        exit-code: '1'

  # 2. Build: compile the app and keep the output for later stages
  build:
    name: Build
    needs: [scan, codeql, security-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Run Build
      run: npm run build

    - name: Check JS bundle size
      run: |
        size_kb=$(find dist/assets -name '*.js' -exec du -k {} + | awk '{sum+=$1} END {print sum}')
        echo "JS bundle total: ${size_kb}KB"
        if [ "$size_kb" -gt 1024 ]; then
          echo "::error::JS bundle ${size_kb}KB exceeds 1024KB limit"
          exit 1
        fi

    - name: Package build output with SHA-256 checksum
      run: |
        tar -czf dist.tar.gz dist
        sha256sum dist.tar.gz > SHA256SUMS
        find helm argocd -type f -print0 | sort -z | xargs -0 sha256sum >> SHA256SUMS
        cat SHA256SUMS

    - name: Upload build output
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: dist
        path: |
          dist.tar.gz
          SHA256SUMS
        if-no-files-found: error

  # 3. Test: unit tests (if defined) and a container smoke test
  test:
    name: Test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
      api_digest: ${{ steps.candidate-api.outputs.digest }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
        cache: npm

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - name: Install Dependencies
      run: npm ci

    - name: Download build output
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: dist

    - name: Verify artifact SHA-256
      run: sha256sum --check --strict SHA256SUMS

    - name: Unit tests with coverage
      run: npm run test:coverage

    - name: Test Go API
      working-directory: backend
      run: |
        # -coverpkg restricts measurement to internal packages; cmd/api/main.go
        # has no unit tests and would otherwise drag the total below any useful gate.
        go test -race -coverprofile=coverage.out -coverpkg=./internal/... ./...
        go vet ./...
        pct=$(go tool cover -func=coverage.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
        echo "Go internal coverage: ${pct}%"
        awk -v p="$pct" 'BEGIN { if (p+0 < 70) { print "::error::Go coverage " p "% is below 70%"; exit 1 } }'

    - name: Upload coverage report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: coverage
        path: coverage
        if-no-files-found: warn

    - name: Set image name
      run: |
        echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/react-app" >> "$GITHUB_ENV"
        echo "API_IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/relay-api" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Push a candidate tag, then pull that exact digest for the checks below.
    # Publish promotes the same digest, so the tested bytes are the shipped bytes.
    - name: Build and push candidate image
      id: candidate
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: true
        sbom: true
        provenance: mode=max
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push API candidate image
      id: candidate-api
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        sbom: true
        provenance: mode=max
        tags: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:candidate
        cache-from: type=gha,scope=api
        cache-to: type=gha,scope=api,mode=max

    - name: Pull candidate images by digest
      if: github.event_name != 'pull_request'
      env:
        DIGEST: ${{ steps.candidate.outputs.digest }}
        API_DIGEST: ${{ steps.candidate-api.outputs.digest }}
      run: |
        docker pull "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        docker tag "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" react-app:test
        docker pull "${REGISTRY}/${API_IMAGE_NAME}@${API_DIGEST}"
        docker tag "${REGISTRY}/${API_IMAGE_NAME}@${API_DIGEST}" relay-api:test

    - name: Build image for pull request checks
      if: github.event_name == 'pull_request'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        load: true
        tags: react-app:test

    - name: Build API image for pull request checks
      if: github.event_name == 'pull_request'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./backend
        file: ./backend/Dockerfile
        load: true
        tags: relay-api:test

    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: react-app:test
        version: v0.75.0
        severity: CRITICAL
        exit-code: '1'
        ignore-unfixed: true

    - name: Scan API image with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: relay-api:test
        version: v0.75.0
        severity: CRITICAL
        exit-code: '1'
        ignore-unfixed: true

    - name: Container structure test
      run: |
        curl -sLo cst https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.22.1/container-structure-test-linux-amd64
        chmod +x cst
        ./cst test --image react-app:test --config container-structure-test.yaml

    - name: Smoke test container
      run: |
        docker run -d --name smoke --read-only --tmpfs /tmp --add-host relay-api:127.0.0.1 -p 8080:8080 react-app:test
        for _ in $(seq 1 15); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
          [ "$code" = "200" ] && echo "Smoke test passed" && exit 0
          sleep 2
        done
        echo "::error::Container did not return HTTP 200 (last status: $code)"
        docker logs smoke
        exit 1

    - name: Write step summary
      if: always()
      env:
        DIGEST: ${{ steps.candidate.outputs.digest }}
        API_DIGEST: ${{ steps.candidate-api.outputs.digest }}
      run: |
        size_bytes=$(docker image inspect react-app:test --format '{{.Size}}' 2>/dev/null || echo "0")
        size_mb=$(( ${size_bytes:-0} / 1024 / 1024 ))
        {
          echo "## Test job summary"
          echo ""
          if [ -n "${DIGEST}" ]; then
            echo "| Image | Digest | Size |"
            echo "|-------|--------|------|"
            echo "| react-app | \`${DIGEST}\` | ${size_mb}MB |"
            echo "| relay-api | \`${API_DIGEST}\` | — |"
          else
            echo "_Pull-request run — no candidate image pushed._"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

  # 4. Verify secrets: fail early with a clear message if any are missing
  verify-secrets:
    name: Verify secrets
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Check required secrets
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        missing=0
        for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
          if [ -z "${!name}" ]; then
            echo "::error::Secret $name is not set (Settings > Secrets and variables > Actions)"
            missing=1
          fi
        done
        exit $missing

  # 5. Publish: promote the tested candidate images to the release tags. imagetools
  #    keeps the digest and attestations, so nothing is rebuilt after testing.
  publish:
    name: Publish
    needs: [test, verify-secrets]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ needs.test.outputs.digest }}
      api_digest: ${{ needs.test.outputs.api_digest }}
    steps:
    - name: Set image name
      run: |
        echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/react-app" >> "$GITHUB_ENV"
        echo "API_IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/relay-api" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Log in to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Promote image to release tags
      env:
        DIGEST: ${{ needs.test.outputs.digest }}
      run: |
        docker buildx imagetools create \
          --tag "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" \
          --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
          "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

    - name: Promote API image to release tags
      env:
        DIGEST: ${{ needs.test.outputs.api_digest }}
      run: |
        docker buildx imagetools create \
          --tag "${REGISTRY}/${API_IMAGE_NAME}:${GITHUB_SHA}" \
          --tag "${REGISTRY}/${API_IMAGE_NAME}:latest" \
          "${REGISTRY}/${API_IMAGE_NAME}@${DIGEST}"

    - name: Verify registry digest (SHA-256)
      env:
        DIGEST: ${{ needs.test.outputs.digest }}
      run: |
        remote=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')
        echo "pushed:   $DIGEST"
        echo "registry: $remote"
        [ "$remote" = "$DIGEST" ] || { echo "::error::Registry digest does not match the pushed digest"; exit 1; }

    - name: Verify API registry digest (SHA-256)
      env:
        DIGEST: ${{ needs.test.outputs.api_digest }}
      run: |
        remote=$(docker buildx imagetools inspect "${REGISTRY}/${API_IMAGE_NAME}:${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')
        echo "pushed:   $DIGEST"
        echo "registry: $remote"
        [ "$remote" = "$DIGEST" ] || { echo "::error::API registry digest does not match the pushed digest"; exit 1; }

  # 6. Sign: keyless cosign signatures by digest. Only this job holds id-token: write.
  sign:
    name: Sign
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # keyless cosign signing (GitHub OIDC)
    steps:
    - name: Set image name
      run: |
        echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/react-app" >> "$GITHUB_ENV"
        echo "API_IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/relay-api" >> "$GITHUB_ENV"

    - name: Log in to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Install cosign
      uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      with:
        # v2 stores signatures as <digest>.sig tags, which Docker Hub supports
        # (v3 uses OCI referrers, which Docker Hub does not expose)
        cosign-release: v2.6.5

    - name: Sign image (keyless, by digest)
      env:
        DIGEST: ${{ needs.publish.outputs.digest }}
      run: |
        for attempt in 1 2 3; do
          if out=$(cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" 2>&1); then
            echo "$out"; exit 0
          fi
          echo "$out"
          if grep -qiE 'unauthorized|insufficient scopes|denied' <<< "$out"; then
            echo "::error::Registry rejected the signature; not retrying"
            exit 1
          fi
          echo "::warning::cosign sign attempt ${attempt} failed; retrying"
          sleep $((attempt * 15))
        done
        echo "::error::cosign sign failed after 3 attempts"
        exit 1

    - name: Sign API image (keyless, by digest)
      env:
        DIGEST: ${{ needs.publish.outputs.api_digest }}
      run: |
        for attempt in 1 2 3; do
          if out=$(cosign sign --yes "${REGISTRY}/${API_IMAGE_NAME}@${DIGEST}" 2>&1); then
            echo "$out"; exit 0
          fi
          echo "$out"
          if grep -qiE 'unauthorized|insufficient scopes|denied' <<< "$out"; then
            echo "::error::Registry rejected the API signature; not retrying"
            exit 1
          fi
          echo "::warning::cosign sign attempt ${attempt} failed; retrying"
          sleep $((attempt * 15))
        done
        echo "::error::cosign sign failed after 3 attempts"
        exit 1

  # 7. Deploy (GitOps): check the signatures, record the digests in the Helm values
  #    and let Argo CD roll them out to the cluster.
  deploy:
    name: Deploy
    needs: [publish, sign]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Download build output
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: dist

    - name: Verify artifact SHA-256 (build output and Helm chart)
      run: sha256sum --check --strict SHA256SUMS

    - name: Set image name
      run: |
        echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/react-app" >> "$GITHUB_ENV"
        echo "API_IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/relay-api" >> "$GITHUB_ENV"

    - name: Log in to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Install cosign
      uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      with:
        cosign-release: v2.6.5

    - name: Verify signature
      env:
        DIGEST: ${{ needs.publish.outputs.digest }}
      run: |
        cosign verify "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" \
          --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/deploy\.yml@" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
        echo "Signature verified for ${DIGEST}"

    - name: Verify API signature
      env:
        DIGEST: ${{ needs.publish.outputs.api_digest }}
      run: |
        cosign verify "${REGISTRY}/${API_IMAGE_NAME}@${DIGEST}" \
          --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/deploy\.yml@" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
        echo "API signature verified for ${DIGEST}"

    - name: Verify SBOM and provenance attestations
      env:
        DIGEST: ${{ needs.publish.outputs.digest }}
        API_DIGEST: ${{ needs.publish.outputs.api_digest }}
      run: |
        # Docker buildx stores SBOM/provenance as OCI attestation manifests
        # inside the image index; imagetools inspect reads the manifest list
        # directly, which works on Docker Hub without the OCI referrers API.
        for ref in "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" "${REGISTRY}/${API_IMAGE_NAME}@${API_DIGEST}"; do
          info=$(docker buildx imagetools inspect "$ref" 2>&1)
          if ! echo "$info" | grep -q "attestation-manifest"; then
            echo "::error::No attestation manifest found in $ref"
            echo "$info"
            exit 1
          fi
          echo "Attestation manifest verified for $ref"
        done

    - name: Pin image digest in Helm values
      env:
        DIGEST: ${{ needs.publish.outputs.digest }}
        API_DIGEST: ${{ needs.publish.outputs.api_digest }}
      run: |
        case "$DIGEST" in sha256:*) ;; *) echo "::error::Missing image digest"; exit 1;; esac
        case "$API_DIGEST" in sha256:*) ;; *) echo "::error::Missing API image digest"; exit 1;; esac
        git fetch origin "${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
        git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
        sed -i "s|^\(  repository:\).*|\1 ${REGISTRY}/${IMAGE_NAME}|" helm/react-app/values.yaml
        sed -i "s|^\(  digest:\).*|\1 \"${DIGEST}\"|" helm/react-app/values.yaml
        sed -i "s|^\(  tag:\).*|\1 ${GITHUB_SHA}|" helm/react-app/values.yaml
        sed -i "/^api:/,/^mysql:/ s|^\(\s*repository:\).*|\1 ${REGISTRY}/${API_IMAGE_NAME}|" helm/react-app/values.yaml
        sed -i "/^api:/,/^mysql:/ s|^\(\s*digest:\).*|\1 \"${API_DIGEST}\"|" helm/react-app/values.yaml
        sed -i "/^api:/,/^mysql:/ s|^\(\s*tag:\).*|\1 ${GITHUB_SHA}|" helm/react-app/values.yaml
        sed -i "/^api:/,/^mysql:/ s|^\(\s*imageDigest:\).*|\1 \"${API_DIGEST}\"|" helm/react-app/values.yaml
        sed -n '/^image:/,/^$/p' helm/react-app/values.yaml
        sed -n '/^api:/,/^mysql:/p' helm/react-app/values.yaml

    - name: Commit values for Argo CD
      env:
        DIGEST: ${{ needs.publish.outputs.digest }}
        API_DIGEST: ${{ needs.publish.outputs.api_digest }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add helm/react-app/values.yaml
        if git diff --cached --quiet; then
          echo "Values already up to date"; exit 0
        fi
        git commit -m "chore(deploy): ${GITHUB_SHA::7} ${DIGEST::19} [skip ci]"
        git push origin "HEAD:${GITHUB_REF_NAME}"

    - name: Verify committed digest
      env:
        DIGEST: ${{ needs.publish.outputs.digest }}
        API_DIGEST: ${{ needs.publish.outputs.api_digest }}
      run: |
        git fetch origin "${GITHUB_REF_NAME}"
        git show "origin/${GITHUB_REF_NAME}:helm/react-app/values.yaml" | grep -F "digest: \"${DIGEST}\""
        git show "origin/${GITHUB_REF_NAME}:helm/react-app/values.yaml" | grep -F "digest: \"${API_DIGEST}\""
        echo "Argo CD will sync ${REGISTRY}/${IMAGE_NAME}@${DIGEST} and ${REGISTRY}/${API_IMAGE_NAME}@${API_DIGEST}"
