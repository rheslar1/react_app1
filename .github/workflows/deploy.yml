# cspell:words buildx cppcheck misconfig tmpfs esac
name: Deploy

'on':
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: docker.io

permissions:
  contents: read

jobs:
  # 1. Static scan: lint (incl. security rules) + dependency audit
  scan:
    name: Static scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Lint (ESLint with security rules)
      run: npm run lint

    - name: Dependency audit
      run: npm audit --audit-level=high

  # 1b. Static analysis: CodeQL, the JavaScript/TypeScript equivalent of cppcheck
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript-typescript

    - name: Analyze
      uses: github/codeql-action/analyze@v3

  # 1c. Security scan: vulnerabilities, committed secrets and misconfigurations
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Trivy filesystem scan
      uses: aquasecurity/trivy-action@v0.33.1
      with:
        version: v0.75.0
        scan-type: fs
        scanners: vuln,secret,misconfig
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '1'

  # 2. Build: compile the app and keep the output for later stages
  build:
    name: Build
    needs: [scan, codeql, security-scan]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Run Build
      run: npm run build

    - name: Package build output with SHA-256 checksum
      run: |
        tar -czf dist.tar.gz dist
        sha256sum dist.tar.gz k8s/*.yaml > SHA256SUMS
        cat SHA256SUMS

    - name: Upload build output
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: |
          dist.tar.gz
          SHA256SUMS
        if-no-files-found: error

  # 3. Test: unit tests (if defined) and a container smoke test
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Download build output
      uses: actions/download-artifact@v4
      with:
        name: dist

    - name: Verify artifact SHA-256
      run: sha256sum --check --strict SHA256SUMS

    - name: Unit tests
      run: npm test --if-present

    - name: Build image for smoke test
      run: docker build -t react-app:test .

    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@v0.33.1
      with:
        image-ref: react-app:test
        version: v0.75.0
        severity: CRITICAL
        exit-code: '1'
        ignore-unfixed: true

    - name: Smoke test container
      run: |
        docker run -d --name smoke --read-only --tmpfs /tmp -p 8080:8080 react-app:test
        for i in $(seq 1 15); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
          [ "$code" = "200" ] && echo "Smoke test passed" && exit 0
          sleep 2
        done
        echo "::error::Container did not return HTTP 200 (last status: $code)"
        docker logs smoke
        exit 1

  # 4. Verify secrets: fail early with a clear message if any are missing
  verify-secrets:
    name: Verify secrets
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Check required secrets
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      run: |
        missing=0
        for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN KUBE_CONFIG; do
          if [ -z "${!name}" ]; then
            echo "::error::Secret $name is not set (Settings > Secrets and variables > Actions)"
            missing=1
          fi
        done
        exit $missing

  # 5. Deploy: push the image and roll it out to the cluster
  deploy:
    name: Deploy
    needs: verify-secrets
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Download build output
      uses: actions/download-artifact@v4
      with:
        name: dist

    - name: Verify artifact SHA-256 (build output and manifests)
      run: sha256sum --check --strict SHA256SUMS

    - name: Set image name
      run: echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/react-app" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push image
      id: push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4

    - name: Configure cluster access
      env:
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      run: |
        mkdir -p "$HOME/.kube"
        echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
        chmod 600 "$HOME/.kube/config"

    - name: Pin image in manifest (by digest)
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        case "$DIGEST" in sha256:*) ;; *) echo "::error::Missing image digest"; exit 1;; esac
        sed -i "s|image: .*react-app[:@].*|image: ${REGISTRY}/${IMAGE_NAME}@${DIGEST}|" k8s/deployment.yaml
        grep -n "image:" k8s/deployment.yaml

    - name: Apply manifests
      run: |
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/

    - name: Create Docker Hub pull secret
      env:
        DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        kubectl -n react-app create secret docker-registry dockerhub-pull \
          --docker-server=https://index.docker.io/v1/ \
          --docker-username="$DH_USER" \
          --docker-password="$DH_TOKEN" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Wait for rollout
      id: rollout
      run: kubectl -n react-app rollout status deployment/react-app --timeout=180s

    - name: Verify deployed image digest
      id: verify
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        echo "Expected digest: $DIGEST"
        spec=$(kubectl -n react-app get deployment react-app -o jsonpath='{.spec.template.spec.containers[0].image}')
        case "$spec" in *"@$DIGEST") ;; *) echo "::error::Deployment image ($spec) does not match pushed digest"; exit 1;; esac
        ids=$(kubectl -n react-app get pods -l app=react-app -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null and .status.phase == "Running") | .status.containerStatuses[0].imageID')
        [ -n "$ids" ] || { echo "::error::No running pods found"; exit 1; }
        bad=0
        while read -r id; do
          echo "pod imageID: $id"
          case "$id" in *"$DIGEST") ;; *) bad=1;; esac
        done <<< "$ids"
        [ "$bad" = 0 ] || { echo "::error::Running pod image digest differs from pushed digest"; exit 1; }
        echo "All running pods match $DIGEST"

    - name: Roll back on failed rollout
      if: failure() && (steps.rollout.outcome == 'failure' || steps.verify.outcome == 'failure')
      run: kubectl -n react-app rollout undo deployment/react-app
