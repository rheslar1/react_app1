name: Release

'on':
  push:
    tags:
      - 'v*'

env:
  REGISTRY: docker.io

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
        cache: npm

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - name: Install Dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Unit tests
      run: npm test

    - name: Test Go API
      working-directory: backend
      run: go test ./... && go vet ./...

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
    - name: Check required secrets
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        missing=0
        for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
          if [ -z "${!name}" ]; then
            echo "::error::Secret $name is not set (Settings > Secrets and variables > Actions)"
            missing=1
          fi
        done
        exit $missing

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Run Build
      run: npm run build

    - name: Set image name
      run: |
        echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/react-app" >> "$GITHUB_ENV"
        echo "API_IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/relay-api" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Log in to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: API Docker metadata
      id: meta-api
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push API image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ${{ steps.meta-api.outputs.tags }}
        labels: ${{ steps.meta-api.outputs.labels }}
        cache-from: type=gha,scope=api
        cache-to: type=gha,scope=api,mode=max

    - name: Create GitHub release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        generate_release_notes: true
