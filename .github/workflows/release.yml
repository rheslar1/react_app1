name: Release

'on':
  push:
    tags:
      - 'v*'

env:
  REGISTRY: docker.io

permissions:
  contents: read

jobs:
  # 1. Verify: the tagged commit must already have passed Deploy on main, then the
  #    checks run again against the tag itself.
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
    - name: Check required secrets
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        missing=0
        for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
          if [ -z "${!name}" ]; then
            echo "::error::Secret $name is not set (Settings > Secrets and variables > Actions)"
            missing=1
          fi
        done
        exit $missing

    - name: Require a passing Deploy run for this commit
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ok=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?head_sha=${GITHUB_SHA}" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
        if [ "$ok" -lt 1 ]; then
          echo "::error::No successful Deploy run for ${GITHUB_SHA}. Tag only commits that passed the main pipeline."
          exit 1
        fi
        echo "Deploy passed for ${GITHUB_SHA}"

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
        cache: npm

    - name: Setup Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - name: Install Dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Unit tests with coverage
      run: npm run test:coverage

    - name: Test Go API
      working-directory: backend
      run: go test -race ./... && go vet ./...

  # 2. Candidate: build both images once, push a candidate tag, then pull the exact
  #    digest for the image scan and smoke test.
  candidate:
    name: Build candidate
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
      api_digest: ${{ steps.candidate-api.outputs.digest }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set image name
      run: |
        echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/react-app" >> "$GITHUB_ENV"
        echo "API_IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/relay-api" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Log in to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push candidate image
      id: candidate
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: true
        sbom: true
        provenance: mode=max
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-release
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push API candidate image
      id: candidate-api
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        sbom: true
        provenance: mode=max
        tags: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:candidate-release
        cache-from: type=gha,scope=api
        cache-to: type=gha,scope=api,mode=max

    - name: Pull candidate images by digest
      env:
        DIGEST: ${{ steps.candidate.outputs.digest }}
        API_DIGEST: ${{ steps.candidate-api.outputs.digest }}
      run: |
        docker pull "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        docker tag "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" react-app:test
        docker pull "${REGISTRY}/${API_IMAGE_NAME}@${API_DIGEST}"
        docker tag "${REGISTRY}/${API_IMAGE_NAME}@${API_DIGEST}" relay-api:test

    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: react-app:test
        version: v0.75.0
        severity: CRITICAL
        exit-code: '1'
        ignore-unfixed: true

    - name: Scan API image with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: relay-api:test
        version: v0.75.0
        severity: CRITICAL
        exit-code: '1'
        ignore-unfixed: true

    - name: Smoke test container
      run: |
        docker run -d --name smoke --read-only --tmpfs /tmp --add-host relay-api:127.0.0.1 -p 8080:8080 react-app:test
        for _ in $(seq 1 15); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
          [ "$code" = "200" ] && echo "Smoke test passed" && exit 0
          sleep 2
        done
        echo "::error::Container did not return HTTP 200 (last status: $code)"
        docker logs smoke
        exit 1

  # 3. Publish: promote the candidate digests to the version tags. The digest does not
  #    change, so the tested image is the released image.
  publish:
    name: Publish
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ needs.candidate.outputs.digest }}
      api_digest: ${{ needs.candidate.outputs.api_digest }}
    steps:
    - name: Set image name
      run: |
        echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/react-app" >> "$GITHUB_ENV"
        echo "API_IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/relay-api" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Log in to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: API Docker metadata
      id: meta-api
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Promote image to version tags
      env:
        DIGEST: ${{ needs.candidate.outputs.digest }}
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        args=()
        while IFS= read -r tag; do [ -n "$tag" ] && args+=(--tag "$tag"); done <<< "$TAGS"
        docker buildx imagetools create "${args[@]}" "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        first=$(head -n1 <<< "$TAGS")
        remote=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest.Digest}}' | tr -d '"')
        echo "pushed:   $DIGEST"
        echo "registry: $remote"
        [ "$remote" = "$DIGEST" ] || { echo "::error::Registry digest does not match the candidate digest"; exit 1; }

    - name: Promote API image to version tags
      env:
        DIGEST: ${{ needs.candidate.outputs.api_digest }}
        TAGS: ${{ steps.meta-api.outputs.tags }}
      run: |
        args=()
        while IFS= read -r tag; do [ -n "$tag" ] && args+=(--tag "$tag"); done <<< "$TAGS"
        docker buildx imagetools create "${args[@]}" "${REGISTRY}/${API_IMAGE_NAME}@${DIGEST}"
        first=$(head -n1 <<< "$TAGS")
        remote=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest.Digest}}' | tr -d '"')
        echo "pushed:   $DIGEST"
        echo "registry: $remote"
        [ "$remote" = "$DIGEST" ] || { echo "::error::API registry digest does not match the candidate digest"; exit 1; }

  # 4. Sign: keyless cosign by digest. Only this job holds id-token: write.
  sign:
    name: Sign
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # keyless cosign signing (GitHub OIDC)
    steps:
    - name: Set image name
      run: |
        echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/react-app" >> "$GITHUB_ENV"
        echo "API_IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/relay-api" >> "$GITHUB_ENV"

    - name: Log in to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Install cosign
      uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      with:
        # v2 stores signatures as <digest>.sig tags, which Docker Hub supports
        cosign-release: v2.6.5

    - name: Sign image (keyless, by digest)
      env:
        DIGEST: ${{ needs.publish.outputs.digest }}
      run: |
        for attempt in 1 2 3; do
          if out=$(cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" 2>&1); then
            echo "$out"; exit 0
          fi
          echo "$out"
          if grep -qiE 'unauthorized|insufficient scopes|denied' <<< "$out"; then
            echo "::error::Registry rejected the signature; not retrying"
            exit 1
          fi
          echo "::warning::cosign sign attempt ${attempt} failed; retrying"
          sleep $((attempt * 15))
        done
        echo "::error::cosign sign failed after 3 attempts"
        exit 1

    - name: Sign API image (keyless, by digest)
      env:
        DIGEST: ${{ needs.publish.outputs.api_digest }}
      run: |
        for attempt in 1 2 3; do
          if out=$(cosign sign --yes "${REGISTRY}/${API_IMAGE_NAME}@${DIGEST}" 2>&1); then
            echo "$out"; exit 0
          fi
          echo "$out"
          if grep -qiE 'unauthorized|insufficient scopes|denied' <<< "$out"; then
            echo "::error::Registry rejected the API signature; not retrying"
            exit 1
          fi
          echo "::warning::cosign sign attempt ${attempt} failed; retrying"
          sleep $((attempt * 15))
        done
        echo "::error::cosign sign failed after 3 attempts"
        exit 1

    - name: Verify signatures
      env:
        DIGEST: ${{ needs.publish.outputs.digest }}
        API_DIGEST: ${{ needs.publish.outputs.api_digest }}
      run: |
        for ref in "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" "${REGISTRY}/${API_IMAGE_NAME}@${API_DIGEST}"; do
          cosign verify "$ref" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Signature verified for $ref"
        done

  # 5. Release: publish the GitHub release once the images are signed.
  release:
    name: GitHub release
    needs: [publish, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Create GitHub release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        generate_release_notes: true
